name: Create Mapping Workflow

on:
  workflow_call:
    inputs:
      mapping-name:
        description: 'Name of the mapping (e.g., shedlock, spring-boot, etc.)'
        required: true
        type: string
      repo-url:
        description: 'Url of the repository to map'
        required: true
        type: string
      coordinates:
        description: 'Artifact coordinates you want to map (e.g., net.javacrumbs.shedlock:shedlock-spring)'
        required: false
        type: string
        default: ''
      java-version:
        description: 'Version of java to use'
        required: false
        type: string
        default: '17'
      runs-on:
        description: 'Runner type (e.g., ubuntu-latest, self-hosted)'
        required: false
        type: string
        default: "java"
      before-mapping-script:
        description: 'path to script to run after the target repo is cloned but before the mapping runs. can be used to adjust the cloned workspace so advisor can work on repos that fail as-cloned. runs with the clone as its working directory (also exported as MAPPING_WORKSPACE)'
        required: false
        type: string
        default: ''
      after-mapping-script:
        description: 'path to script to run after the mapping is completed. can be used to cleanup or adjust the mapping prior to opening pr'
        required: false
        type: string
        default: ''
      debug:
        description: 'Prints out SAA debug messages'
        required: false
        type: boolean
        default: false
      offline:
        description: 'Perform offline mapping - install app tags prior to mapping offline'
        required: false
        type: boolean
        default: false
      large-disk:
        description: 'Perform runner disk cleanup prior to mapping. Needed for some large repos'
        required: false
        type: boolean
        default: false

    secrets:
      GH_PULL_REQUEST_TOKEN:
        required: true
      BROADCOM_SPRING_USERNAME:
        required: true
      BROADCOM_SPRING_PASSWORD:
        required: true
jobs:
  mapping:
    timeout-minutes: 900
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Free Disk Space (Ubuntu)
        if: inputs.large-disk == true
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false # Set to true if you DON'T need pre-installed Go/Node/Python
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'liberica'
      # Job-scope everything Gradle. On a persistent/self-hosted runner a shared
      # ~/.gradle leaks the init.d repo config written below into every other repo
      # that builds on the box — the pluginManagement override removes the default
      # Gradle Plugin Portal, which broke a sibling repo's CI (2026-07-14).
      # RUNNER_TEMP is wiped between jobs, so init scripts, caches, and wrapper
      # dists all stay job-local. mavenLocal() still resolves to the shared
      # ~/.m2/repository, so the Maven<->Gradle install/consume handoff is unchanged.
      - name: Isolate Gradle home (self-hosted-safe)
        run: |
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-home" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/gradle-home/init.d"
      - name: Cache Maven
        if: inputs.runs-on != 'self-hosted' && inputs.runs-on != 'java'
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: org-maven-${{ runner.os }}-v2
          restore-keys: org-maven-${{ runner.os }}-v2
      # Key bumped v2->v3: actions/cache archives absolute paths, so a pre-isolation
      # archive would restore into ~/.gradle and re-pollute the shared home. The
      # self-hosted skip is gone: the isolated home starts empty every job, so
      # self-hosted runs now need the cache restore too (the skip only made sense
      # when the shared ~/.gradle WAS the warm cache).
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/gradle-home/caches
            ${{ runner.temp }}/gradle-home/wrapper
          key: org-gradle-${{ runner.os }}-v3
          restore-keys: org-gradle-${{ runner.os }}-v3
      # Maven config is already shared-home-tolerable: s4u/maven-settings-action backs
      # up ~/.m2/settings.xml and restores it in its post step (residual: a hard-killed
      # job leaves the credentialed settings.xml behind on a shared runner).
      - name: Configure Maven Settings
        uses: 's4u/maven-settings-action@v4.0.0'
        with:
          servers: '[{"id": "tanzu-spring-release", "username":  "${{ secrets.BROADCOM_SPRING_USERNAME }}", "password": "${{ secrets.BROADCOM_SPRING_PASSWORD }}"}]'
          repositories: '[{"id":"tanzu-spring-release", "name":"Spring Enterprise Supported Releases","url":"${{vars.BROADCOM_SPRING_REPOSITORY}}","snapshots":{"enabled":false}}]'
          pluginRepositories: '[{"id":"tanzu-spring-release", "name":"Spring Enterprise Supported Releases","url":"${{vars.BROADCOM_SPRING_REPOSITORY}}","snapshots":{"enabled":false}}]'
      - name: Configure Gradle Repos
        run: |
          mkdir -p "$GRADLE_USER_HOME/init.d"
          cat > "$GRADLE_USER_HOME/init.d/broadcom.gradle" << 'EOF'
            allprojects {
                repositories {
                    mavenLocal()
                    def springRepoUrl = System.getenv("BROADCOM_SPRING_REPOSITORY")
                    def alreadyExists = repositories.any { repo ->
                      repo instanceof MavenArtifactRepository && repo.url?.toString() == springRepoUrl
                    }
                    
                    if (!alreadyExists && springRepoUrl) {
                      maven {
                        url = System.getenv("BROADCOM_SPRING_REPOSITORY")
                        name = "Spring Enterprise Supported Releases"
                        credentials {
                            username = System.getenv("BROADCOM_SPRING_USERNAME")
                            password = System.getenv("BROADCOM_SPRING_PASSWORD")
                        }
                      }
                    }
                    mavenCentral()
                }
            }
          
            settingsEvaluated { settings ->
                settings.pluginManagement {
                    repositories {
                        mavenLocal()
                        def springRepoUrl = System.getenv("BROADCOM_SPRING_REPOSITORY")
                        def alreadyExists = repositories.any { repo ->
                            repo instanceof MavenArtifactRepository && repo.url?.toString() == springRepoUrl
                        }
                        if (!alreadyExists && springRepoUrl) {
                            maven {
                                url = springRepoUrl
                                name = "Spring Enterprise Supported Releases"
                                credentials {
                                    username = System.getenv("BROADCOM_SPRING_USERNAME")
                                    password = System.getenv("BROADCOM_SPRING_PASSWORD")
                                }
                            }
                        }
                        mavenCentral()
                    }
                }
            }
          EOF
      - name: Configure Gradle Publish Plugin if not present
        run: |
          mkdir -p "$GRADLE_USER_HOME/init.d"
          cat > "$GRADLE_USER_HOME/init.d/maven-publish-init.gradle" << 'EOF'
          allprojects {
              plugins.withType(JavaPlugin) {
                  apply plugin: 'maven-publish'

                  afterEvaluate {
                      if (!publishing.publications.findByName('mavenJava')) {
                          publishing {
                              publications {
                                  mavenJava(MavenPublication) {
                                      from components.java

                                      // Use project coordinates
                                      groupId = project.group ?: project.name
                                      artifactId = project.name
                                      version = project.version ?: 'unspecified'
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF
      - name: Clone repo
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.GH_PULL_REQUEST_TOKEN }}
        run: |
          set -e
          
          mkdir -p ignore
          URL=$(echo "${{ inputs.repo-url }}" | sed 's/https:\/\///')
          git clone "https://x-access-token:${REPO_TOKEN}@$URL" ignore

      # Runs against the freshly cloned target repo, before anything builds it --
      # some repos can't be mapped as-cloned (e.g. a Maven wrapper with no
      # .mvn/wrapper/maven-wrapper.properties, which every ./mvnw-preferring step
      # below would then fail on). Deliberately placed ahead of the offline tag
      # install so both that and the mapping see the same fixed-up workspace.
      - name: execute before mapping script
        if: ${{ inputs.before-mapping-script != '' }}
        shell: bash
        env:
          MAPPING_WORKSPACE: ${{ github.workspace }}/ignore
        run: |
          set -e

          # The script lives in the calling repo's checkout, but operates on the
          # clone -- so resolve it against GITHUB_WORKSPACE and run it from the
          # clone, letting a script treat "." as the repo root it's fixing up.
          SCRIPT_PATH="$GITHUB_WORKSPACE/${{ inputs.before-mapping-script }}"

          if [ ! -f "$SCRIPT_PATH" ]; then
            echo "::error::before-mapping-script not found: $SCRIPT_PATH"
            exit 1
          fi

          cd "$MAPPING_WORKSPACE"

          case "$SCRIPT_PATH" in
            *.py)
              echo "Detected Python script. Running with python3..."
              python3 "$SCRIPT_PATH"
              ;;
            *.sh)
              echo "Detected Shell script. Running with bash..."
              chmod +x "$SCRIPT_PATH"
              bash "$SCRIPT_PATH"
              ;;
            *)
              echo "::error::Unsupported file extension for script: $SCRIPT_PATH"
              exit 1
              ;;
          esac

      - name: Install tagged versions if offline mapping
        if: inputs.offline == true
        shell: bash
        run: |
          set -e
          
          cd ignore
          
          # Get all semver tags, extract latest patch per major.minor
          git fetch --tags
          tags=$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | awk -F. '{
            key = $1 "." $2
            versions[key] = $0
          } END {
            for (k in versions) print versions[k]
          }' | sort -V)

          if [[ -z "$tags" ]]; then
            echo "No semver tags found"
            exit 1
          fi

          echo "Tags to process:"
          echo "$tags"

          # Save current ref to return to later
          original_ref=$(git rev-parse HEAD)

          # Function to detect and run install
          install_build() {
            if [[ -f "mvnw" ]]; then
              chmod +x mvnw
              ./mvnw install -DskipTests -B
            elif [[ -f "gradlew" ]]; then
              chmod +x gradlew
              ./gradlew publishToMavenLocal -x test
            elif [[ -f "pom.xml" ]]; then
              mvn install -DskipTests -B
            elif [[ -f "build.gradle" ]] || [[ -f "build.gradle.kts" ]]; then
              gradle publishToMavenLocal -x test
            else
              echo "No recognized build system found"
              return 1
            fi
          }

          # Iterate and install each tag
          for tag in $tags; do
            echo "========================================="
            echo "Processing tag: $tag"
            echo "========================================="
            git checkout "$tag" --quiet
            install_build
          done

          # Return to original ref
          git checkout "$original_ref" --quiet
          echo "Done. Returned to original ref."

      # The CLI fetch is its OWN step, outside the mapping step's continue-on-error (#5, the
      # upgrade-app.yml fix from #4): inside it, a failed download (the Broadcom token lasts 2
      # days, so a 401 is the common case) was masked and surfaced only as the anonymous
      # "fail if error outside advisor" exit. A download failure is never a mapping finding.
      - name: Download Spring Application Advisor CLI
        env:
          ARTIFACTORY_TOKEN: ${{ secrets.BROADCOM_SPRING_PASSWORD }}
          CLI_DOWNLOAD_URL: ${{ vars.SPRING_APP_ADVISOR_DOWNLOAD_URL }}
          RUNS_ON: ${{ inputs.runs-on }}
        run: |
          set -o pipefail
          # A runner labelled exactly 'self-hosted' carries a preinstalled advisor on PATH.
          if [ "$RUNS_ON" = "self-hosted" ]; then
            cli="$(command -v advisor)" || { echo "::error::runs-on is 'self-hosted' but no 'advisor' is on PATH — install it on the runner, or pass a runs-on that downloads it"; exit 1; }
            echo "ADVISOR_CLI=$cli" >> "$GITHUB_ENV"
            echo "SAA CLI ready: preinstalled $cli"
            exit 0
          fi
          [ -n "$CLI_DOWNLOAD_URL" ] || { echo "::error::vars.SPRING_APP_ADVISOR_DOWNLOAD_URL is empty"; exit 1; }
          [ -n "$ARTIFACTORY_TOKEN" ] || { echo "::error::secrets.BROADCOM_SPRING_PASSWORD is empty"; exit 1; }

          # Unique per-run dir so concurrent mapping jobs on a shared/self-hosted
          # host don't clobber each other's download/extraction under /tmp.
          ADVISOR_TMP_DIR="$(mktemp -d)"
          echo "ADVISOR_TMP_DIR=$ADVISOR_TMP_DIR" >> "$GITHUB_ENV"
          echo "Downloading CLI from: $CLI_DOWNLOAD_URL into $ADVISOR_TMP_DIR"

          # -f: an HTTP error fails curl instead of writing the error body where the tarball
          # belongs; -w still reports the status so the refusal can name it.
          rc=0
          http=$(curl -fsSL \
            --connect-timeout 15 --max-time 120 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            -H "Authorization: Bearer $ARTIFACTORY_TOKEN" \
            -o "$ADVISOR_TMP_DIR/advisor-linux.tar" \
            -w '%{http_code}' \
            "$CLI_DOWNLOAD_URL") || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::SAA CLI download failed: HTTP ${http:-none}, curl exit $rc. 401/403 = the Broadcom token (secrets.BROADCOM_SPRING_PASSWORD) expired or lacks access; it lasts 2 days, rotate it. 404 = vars.SPRING_APP_ADVISOR_DOWNLOAD_URL names a version that does not exist."
            exit 1
          fi
          tar -xf "$ADVISOR_TMP_DIR/advisor-linux.tar" -C "$ADVISOR_TMP_DIR" --strip-components=1 --exclude=./META-INF
          [ -x "$ADVISOR_TMP_DIR/advisor" ] || { echo "::error::the downloaded archive holds no executable 'advisor'"; exit 1; }
          echo "ADVISOR_CLI=$ADVISOR_TMP_DIR/advisor" >> "$GITHUB_ENV"
          echo "SAA CLI ready: HTTP $http, $(du -h "$ADVISOR_TMP_DIR/advisor-linux.tar" | cut -f1)"
      - name: Create mapping
        id: create-mapping
        continue-on-error: true
        env:
          MAPPING_CONFIG_REPO: ${{ inputs.repo-url }}
          MAPPING_CONFIG_COORDINATES: ${{ inputs.coordinates }}
          SAA_DEBUG: ${{ inputs.debug }}
        run: |
          # The CLI was fetched (or found preinstalled) by the download step above (ADVISOR_CLI via GITHUB_ENV).
          [ -x "${ADVISOR_CLI:-}" ] || { echo "::error::no advisor CLI at '${ADVISOR_CLI:-<unset>}' — the download step did not export it"; exit 1; }
          cli="$ADVISOR_CLI"

          echo "Running advisor with:"
          echo "  Git Repo: '$MAPPING_CONFIG_REPO'"
          echo "  Artifact Coordinates: '$MAPPING_CONFIG_COORDINATES'"
          
          cd ignore
          
          $cli mapping create ${MAPPING_CONFIG_COORDINATES:+-c "$MAPPING_CONFIG_COORDINATES"} ${SAA_DEBUG:+--debug}
          
          mv .advisor/mappings/* ../.advisor/mappings

      # hashFiles patterns are anchored at the workspace root. The old '.advisor/errors/'
      # (searched as '.advisor/errors/**' — @actions/glob's implicitDescendants) only
      # matched errors at the root, but the CLI runs from ignore/ and writes them there,
      # so advisor failures rode continue-on-error to a green run (saa-mappings
      # 2026-09-15: every hive version failed to resolve, the run succeeded and opened a
      # PR deleting real version blocks). The '**/' variant is the one that matches.
      # Same fix as upgrade-app.yml; pinned by scripts/test_errors_step.py.
      - name: Get errors if exist
        if: always() && hashFiles('.advisor/errors/**', '**/.advisor/errors/**') != ''
        run: |
          find . -path '*/.advisor/errors/*' -type f -print -exec cat {} \;
          exit 1
      - name: fail if error outside advisor
        if: steps.create-mapping.outcome == 'failure'
        run: |
          exit 1
      - name: execute after mapping script
        if: ${{ inputs.after-mapping-script != '' }}
        shell: bash
        run: |
          SCRIPT_PATH="${{ inputs.after-mapping-script }}"
          case "$SCRIPT_PATH" in
            *.py)
              echo "Detected Python script. Running with python3..."
              python3 "$SCRIPT_PATH"
              ;;
            *.sh)
              echo "Detected Shell script. Running with bash..."
              chmod +x "$SCRIPT_PATH"
              bash "$SCRIPT_PATH"
              ;;
            *)
              echo "::error::Unsupported file extension for script: $SCRIPT_PATH"
              exit 1
              ;;
          esac
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_PULL_REQUEST_TOKEN }}
          commit-message: "${{ inputs.mapping-name }} mapping update"
          title: "${{ inputs.mapping-name }} mapping update"
          body: "Automatic ${{ inputs.mapping-name }} mapping update"
          branch: "${{ inputs.mapping-name }}-mapping-update"
          add-paths: ".advisor/mappings"