name: Upgrade Application Workflow

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Version of java to use'
        required: false
        type: string
        default: '17'
      runs-on:
        description: 'Runner type (e.g., ubuntu-latest, self-hosted)'
        required: false
        type: string
        default: 'ubuntu-latest'
      saa-debug:
        description: 'Prints out SAA debug messages'
        required: false
        type: boolean
        default: false
      saa-build-tool:
        description: 'Selects the build tool used to resolve the project dependencies options: mvnw, mvn, gradlew, gradle'
        required: false
        type: string
      saa-build-tool-options:
        description: 'Build arguments to pass to the build tool'
        required: false
        type: string
      saa-build-tool-jvm-args:
        description: 'JVM arguments to pass into the build tool (default: $BUILD_TOOL_JVM_ARGS)'
        required: false
        type: string
      saa-force:
        description: 'Force execution of full Upgrade Plan, including intermediate dependencies'
        required: false
        type: boolean
        default: false
      saa-path:
        description: 'Selects the root directory of the source code repository (default: current directory)'
        required: false
        type: string
      saa-remove-excluded-artifacts:
        description: 'Removes excluded artifacts as part of upgrade plan'
        required: false
        type: boolean
        default: false
      saa-after-upgrade-command:
        description: 'Build tool command to execute after upgrade-plan apply'
        required: false
        type: string
      saa-create-pr:
        description: 'Generates a pull request with the code upgrades'
        required: false
        type: boolean
        default: true
      saa-squash:
        description: 'Number of steps of the original Upgrade Plan that will be squashed as the first Upgrade Plan step'
        required: false
        type: string
        default: "10"
      upgrade-mode:
        description: 'Mode for advisor. Valid values are "upgrade" or "patch". Upgrade will work to upgrade your application to the next major/minor available. Patch will maintain your current major.minor and only bump to the latest patches.'
        default: "upgrade"
        required: false
        type: string
      saa-scm-host:
        description: 'Trusted hostname for self-hosted GitLab or GitHub instances. Required when using --push with any host other than github.com or gitlab.com. (default: $ADVISOR_SCM_HOST)'
        required: false
        type: string
      saa-branch-prefix:
        description: 'Prefix to use for the branch name created for the upgrade'
        required: false
        type: string
        default: ""

    secrets:
      GH_PULL_REQUEST_TOKEN:
        required: true
      BROADCOM_SPRING_USERNAME:
        required: true
      BROADCOM_SPRING_PASSWORD:
        required: true

jobs:
  upgrade:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      # checkout calling repo's code
      - uses: actions/checkout@v6
      # checkout saa-workflows so we can access the scripts here
      - uses: actions/checkout@v6
        with:
          repository: abeyta-labs/saa-workflows
          path: .github/abeyta-labs/saa-workflows
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'liberica'
      # Job-scope everything Gradle. On a persistent/self-hosted runner a shared
      # ~/.gradle leaks the init.d repo config written below into every other repo
      # that builds on the box — the pluginManagement override removes the default
      # Gradle Plugin Portal, which broke a sibling repo's CI (2026-07-14).
      # RUNNER_TEMP is wiped between jobs, so init scripts, caches, and wrapper
      # dists all stay job-local. mavenLocal() still resolves to the shared
      # ~/.m2/repository, so the Maven<->Gradle install/consume handoff is unchanged.
      - name: Isolate Gradle home (self-hosted-safe)
        run: |
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-home" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/gradle-home/init.d"
      - name: Cache Maven
        if: inputs.runs-on != 'self-hosted' && inputs.runs-on != 'java'
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: org-maven-${{ runner.os }}-v1
          restore-keys: org-maven-${{ runner.os }}-
      # Key bumped v1->v2 and restore-keys made EXACT: actions/cache archives absolute
      # paths, so a pre-isolation archive (which the old prefix restore-key would happily
      # match) would restore into ~/.gradle and re-pollute the shared home.
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/gradle-home/caches
            ${{ runner.temp }}/gradle-home/wrapper
          key: org-gradle-${{ runner.os }}-v2
          restore-keys: org-gradle-${{ runner.os }}-v2
      # Maven config is already shared-home-tolerable: s4u/maven-settings-action backs
      # up ~/.m2/settings.xml and restores it in its post step (residual: a hard-killed
      # job leaves the credentialed settings.xml behind on a shared runner).
      - name: Generates Maven Settings
        uses: 's4u/maven-settings-action@v4.0.0'
        with:
          servers: '[{"id": "tanzu-spring-release", "username":  "${{ secrets.BROADCOM_SPRING_USERNAME }}", "password": "${{ secrets.BROADCOM_SPRING_PASSWORD }}"}]'
          repositories: '[{"id":"tanzu-spring-release", "name":"Spring Enterprise Supported Releases","url":"${{vars.BROADCOM_SPRING_REPOSITORY}}","snapshots":{"enabled":false}}]'
          pluginRepositories: '[{"id":"tanzu-spring-release", "name":"Spring Enterprise Supported Releases","url":"${{vars.BROADCOM_SPRING_REPOSITORY}}","snapshots":{"enabled":false}}]'
      - name: Configure Gradle Repos
        run: |
          mkdir -p "$GRADLE_USER_HOME/init.d"
          cat > "$GRADLE_USER_HOME/init.d/broadcom.gradle" << 'EOF'
            allprojects {
                repositories {
                    mavenLocal()
                    def springRepoUrl = System.getenv("BROADCOM_SPRING_REPOSITORY")
                    def alreadyExists = repositories.any { repo ->
                      repo instanceof MavenArtifactRepository && repo.url?.toString() == springRepoUrl
                    }

                    if (!alreadyExists && springRepoUrl) {
                      maven {
                        url = System.getenv("BROADCOM_SPRING_REPOSITORY")
                        name = "Spring Enterprise Supported Releases"
                        credentials {
                            username = System.getenv("BROADCOM_SPRING_USERNAME")
                            password = System.getenv("BROADCOM_SPRING_PASSWORD")
                        }
                      }
                    }
                    mavenCentral()
                }
            }

            settingsEvaluated { settings ->
                settings.pluginManagement {
                    repositories {
                        mavenLocal()
                        def springRepoUrl = System.getenv("BROADCOM_SPRING_REPOSITORY")
                        def alreadyExists = repositories.any { repo ->
                            repo instanceof MavenArtifactRepository && repo.url?.toString() == springRepoUrl
                        }
                        if (!alreadyExists && springRepoUrl) {
                            maven {
                                url = springRepoUrl
                                name = "Spring Enterprise Supported Releases"
                                credentials {
                                    username = System.getenv("BROADCOM_SPRING_USERNAME")
                                    password = System.getenv("BROADCOM_SPRING_PASSWORD")
                                }
                            }
                        }
                        mavenCentral()
                        // Restore Gradle's default plugin source: overriding pluginManagement
                        // repositories REPLACES the implicit Plugin Portal, and many plugin
                        // MARKERS (com.diffplug.spotless, org.gradle.toolchains.foojay-resolver-
                        // convention, ...) exist only there — without this, any Gradle project
                        // using a portal-only plugin fails dependency resolution (boostertickets,
                        // 2026-08-04).
                        gradlePluginPortal()
                    }
                }
            }
          EOF
      - name: Run Spring Application Advisor
        continue-on-error: true
        env:
          GIT_TOKEN_FOR_PRS: ${{ secrets.GH_PULL_REQUEST_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PULL_REQUEST_TOKEN }}
          ARTIFACTORY_TOKEN: ${{ secrets.BROADCOM_SPRING_PASSWORD }}
          CLI_DOWNLOAD_URL: ${{ vars.SPRING_APP_ADVISOR_DOWNLOAD_URL }}
          SPRING_ADVISOR_MAPPING_CUSTOM_0_GIT_URI: "https://github.com/abeyta-labs/saa-mappings.git"
          SPRING_ADVISOR_MAPPING_CUSTOM_0_GIT_TOKEN: ${{ secrets.GH_PULL_REQUEST_TOKEN }}
          SPRING_ADVISOR_MAPPING_CUSTOM_0_GIT_PATH: ".advisor/mappings/"
          SPRING_ADVISOR_MAPPING_CUSTOM_0_GIT_BRANCH: "main"
          SPRING_ADVISOR_MAPPING_CUSTOM_0_MERGE_STRATEGY: "override"
          BRANCH_PREFIX_FOR_UPGRADE: ${{ inputs.saa-branch-prefix }}
        run: |
          # download the cli
          echo "Downloading CLI from: $CLI_DOWNLOAD_URL"

          # Unique per-run dir so concurrent upgrade jobs on a shared/self-hosted
          # host don't clobber each other's download/extraction under /tmp.
          ADVISOR_TMP_DIR="$(mktemp -d)"
          echo "Using temp dir: $ADVISOR_TMP_DIR"

          curl -L -H "Authorization: Bearer $ARTIFACTORY_TOKEN"  -o "$ADVISOR_TMP_DIR/advisor-linux.tar" -X GET $CLI_DOWNLOAD_URL
          tar -xf "$ADVISOR_TMP_DIR/advisor-linux.tar" -C "$ADVISOR_TMP_DIR" --strip-components=1 --exclude=./META-INF

          if [[ "${{ inputs.upgrade-mode }}" == "patch" ]]; then
            echo "Running advisor in patch mode"

            # build the patch apply command based on inputs
            PATCH_APPLY_CMD=()
            PATCH_APPLY_CMD+=("$ADVISOR_TMP_DIR/advisor")
            PATCH_APPLY_CMD+=("patch")
            PATCH_APPLY_CMD+=("apply")
            [[ "${{ inputs.saa-debug }}" == "true" ]] && PATCH_APPLY_CMD+=("--debug")
            [[ -n "${{ inputs.saa-build-tool }}" ]] && PATCH_APPLY_CMD+=("--build-tool" "${{ inputs.saa-build-tool }}")
            [[ -n "${{ inputs.saa-build-tool-options }}" ]] && PATCH_APPLY_CMD+=("--build-tool-options" "${{ inputs.saa-build-tool-options }}")
            [[ -n "${{ inputs.saa-build-tool-jvm-args }}" ]] && PATCH_APPLY_CMD+=("--build-tool-jvm-args" "${{ inputs.saa-build-tool-jvm-args }}")
            [[ -n "${{ inputs.saa-path }}" ]] && PATCH_APPLY_CMD+=("--path" "${{ inputs.saa-path }}")
            [[ -n "${{ inputs.saa-scm-host }}" ]] && PATCH_APPLY_CMD+=("--scm-host" "${{ inputs.saa-scm-host }}")
            [[ "${{ inputs.saa-create-pr }}" == "true" ]] && PATCH_APPLY_CMD+=("--push")

            echo "Running patch apply"
            echo "${PATCH_APPLY_CMD[@]}"
            "${PATCH_APPLY_CMD[@]}"

            # clean up
            rm -rf "$ADVISOR_TMP_DIR"
            exit 0
          fi

          echo "Running advisor with mapping configuration:"
          echo "  Mapping Git Repo: $SPRING_ADVISOR_MAPPING_CUSTOM_0_GIT_URI"
          echo "  Mapping Git Path: $SPRING_ADVISOR_MAPPING_CUSTOM_0_GIT_PATH"
          echo "  Mapping Git Branch: $SPRING_ADVISOR_MAPPING_CUSTOM_0_GIT_BRANCH"
          
          # build the build-config get command based on inputs
          BUILD_CONFIG_CMD=()
          BUILD_CONFIG_CMD+=("$ADVISOR_TMP_DIR/advisor")
          BUILD_CONFIG_CMD+=("build-config")
          BUILD_CONFIG_CMD+=("get")
          [[ "${{ inputs.saa-debug }}" == "true" ]] && BUILD_CONFIG_CMD+=("--debug")
          [[ -n "${{ inputs.saa-build-tool }}" ]] && BUILD_CONFIG_CMD+=("--build-tool" "${{ inputs.saa-build-tool }}")
          [[ -n "${{ inputs.saa-build-tool-options }}" ]] && BUILD_CONFIG_CMD+=("--build-tool-options" "${{ inputs.saa-build-tool-options }}")
          [[ -n "${{ inputs.saa-path }}" ]] && BUILD_CONFIG_CMD+=("--path" "${{ inputs.saa-path }}")
          
          # update the build config
          echo "Updating the build config"
          echo "${BUILD_CONFIG_CMD[@]}"
          "${BUILD_CONFIG_CMD[@]}"
          
          UPGRADE_PLAN_OUTPUT="upgrade-plan-get-output.txt"
          NO_UPGRADES_EXIST_PHRASE="No upgrade plans available"
          MAPPING_MISSING_PHRASE="Please request your administrator to configure the projects of the following dependencies"
          SOME_UPGRADES_TO_APPLY="Some upgrades were not included in the upgrade plan"
          
          # build the upgrade-plan get command based on inputs
          UPGRADE_PLAN_GET_CMD=()
          UPGRADE_PLAN_GET_CMD+=("$ADVISOR_TMP_DIR/advisor")
          UPGRADE_PLAN_GET_CMD+=("upgrade-plan")
          UPGRADE_PLAN_GET_CMD+=("get")
          [[ "${{ inputs.saa-debug }}" == "true" ]] && UPGRADE_PLAN_GET_CMD+=("--debug")
          [[ "${{ inputs.saa-remove-excluded-artifacts }}" == "true" ]] && UPGRADE_PLAN_GET_CMD+=("--remove-excluded-artifacts")
          [[ "${{ inputs.saa-force }}" == "true" ]] && UPGRADE_PLAN_GET_CMD+=("--force")
          [[ -n "${{ inputs.saa-path }}" ]] && UPGRADE_PLAN_GET_CMD+=("--path" "${{ inputs.saa-path }}")
          [[ -n "${{ inputs.saa-build-tool-options }}" ]] && UPGRADE_PLAN_GET_CMD+=("--build-tool-options" "${{ inputs.saa-build-tool-options }}")
          [[ -n "${{ inputs.saa-squash }}" ]] && UPGRADE_PLAN_GET_CMD+=("--squash" "${{ inputs.saa-squash }}")
          
          # run upgrade-plan get - see if we have missing mapping files
          echo "${UPGRADE_PLAN_GET_CMD[@]}"
          "${UPGRADE_PLAN_GET_CMD[@]}" 2>&1 | tee $UPGRADE_PLAN_OUTPUT
          
          if grep -q "$MAPPING_MISSING_PHRASE" $UPGRADE_PLAN_OUTPUT; then
            echo "Mappings are missing, lets create new mapping jobs"
            # Parse the missing artifacts out of the advisor output. Only the block
            # under the "Please request your administrator..." phrase holds real
            # coordinates — newer CLIs also print single-tab bullets elsewhere
            # ("Projects discovered:" entries like "shedlock: 7.7.x (no upgrades
            # available)", warning lines), which a bare '^\t- ' grep scoops up as
            # fake artifacts. Coordinates never contain whitespace, so require
            # exactly groupId:artifactId and stop at the first non-tab line.
            awk -v phrase="$MAPPING_MISSING_PHRASE" '
              index($0, phrase) { in_block = 1; next }
              in_block && /^\t- [A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+$/ { sub(/^\t- /, ""); print; next }
              in_block && /^[^\t]/ && NF { in_block = 0 }
            ' "$UPGRADE_PLAN_OUTPUT" > artifacts.txt
            echo "Extracted $(wc -l < artifacts.txt) missing artifacts:"
            cat artifacts.txt
            # move artifacts file into saa workflows and work from there
            cp artifacts.txt .github/abeyta-labs/saa-workflows/scripts/artifacts.txt
            cd .github/abeyta-labs/saa-workflows/scripts
            # attempt to find repo urls for the missing artifacts
            python3 bulk-repo-lookup.py artifacts.txt -o artifact-details.json
            # generate mappings for artifacts where we have the repo urls found
            python3 generate-mapping-workflow.py --repo abeyta-labs/saa-mappings
          elif ! grep -q "$NO_UPGRADES_EXIST_PHRASE" "$UPGRADE_PLAN_OUTPUT" || grep -q "$SOME_UPGRADES_TO_APPLY" "$UPGRADE_PLAN_OUTPUT"; then
            # cleanup workspace of saa-workflow files prior to upgrading. They should be not included in the commit.
            rm -rf .github/abeyta-labs/saa-workflows
            rm $UPGRADE_PLAN_OUTPUT
            # run the upgrade, create a branch to hold the change, commit the change in the branch, create a PR for the branch into main
            # build the upgrade-plan apply command based on inputs
            UPGRADE_PLAN_APPLY_CMD=()
            UPGRADE_PLAN_APPLY_CMD+=("$ADVISOR_TMP_DIR/advisor")
            UPGRADE_PLAN_APPLY_CMD+=("upgrade-plan")
            UPGRADE_PLAN_APPLY_CMD+=("apply")
            [[ "${{ inputs.saa-debug }}" == "true" ]] && UPGRADE_PLAN_APPLY_CMD+=("--debug")
            [[ -n "${{ inputs.saa-path }}" ]] && UPGRADE_PLAN_APPLY_CMD+=("--path" "${{ inputs.saa-path }}")
            [[ "${{ inputs.saa-force }}" == "true" ]] && UPGRADE_PLAN_APPLY_CMD+=("--force")
            [[ "${{ inputs.saa-remove-excluded-artifacts }}" == "true" ]] && UPGRADE_PLAN_APPLY_CMD+=("--remove-excluded-artifacts")
            [[ -n "${{ inputs.saa-build-tool }}" ]] && UPGRADE_PLAN_APPLY_CMD+=("--build-tool" "${{ inputs.saa-build-tool }}")
            [[ -n "${{ inputs.saa-build-tool-options }}" ]] && UPGRADE_PLAN_APPLY_CMD+=("--build-tool-options" "${{ inputs.saa-build-tool-options }}")
            [[ -n "${{ inputs.saa-build-tool-jvm-args }}" ]] && UPGRADE_PLAN_APPLY_CMD+=("--build-tool-jvm-args" "${{ inputs.saa-build-tool-jvm-args }}")
            [[ -n "${{ inputs.saa-squash }}" ]] && UPGRADE_PLAN_APPLY_CMD+=("--squash" "${{ inputs.saa-squash }}")
            [[ -n "${{ inputs.saa-after-upgrade-command }}" ]] && UPGRADE_PLAN_APPLY_CMD+=("--after-upgrade-cmd" "${{ inputs.saa-after-upgrade-command }}")
            [[ "${{ inputs.saa-create-pr }}" == "true" ]] && UPGRADE_PLAN_APPLY_CMD+=("--push")
            [[ "${{ inputs.saa-create-pr }}" == "true" ]] && UPGRADE_PLAN_APPLY_CMD+=("--token=$GIT_TOKEN_FOR_PRS")
          
            echo "Running upgrade-plan apply"
            echo "${UPGRADE_PLAN_APPLY_CMD[@]}"
            "${UPGRADE_PLAN_APPLY_CMD[@]}"
          else
            # Get current Spring Boot version before upgrade
            old_version=$(./mvnw help:evaluate -Dexpression=project.parent.version -q -DforceStdout 2>/dev/null || echo "unknown")
            new_version="unknown"
          
            if [ -f "pom.xml" ]; then
              echo "Upgrading patch versions of spring in maven project"
              ./mvnw org.openrewrite.maven:rewrite-maven-plugin:run \
                -Drewrite.configLocation=https://raw.githubusercontent.com/abeyta-labs/saa-workflows/refs/heads/main/recipes/spring-patch-versions.yml \
                -Drewrite.activeRecipes=me.abeyta.UpgradeAllSpringLatestPatch
          
              # Extract new Spring Boot version from pom.xml changes
              new_version=$(./mvnw help:evaluate -Dexpression=project.parent.version -q -DforceStdout 2>/dev/null || \
                git diff pom.xml | grep -A1 "spring-boot-starter-parent" | grep "<version>" | head -1 | sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p' | tr -d '+' || \
                echo "unknown")
            elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
              echo "Upgrading patch versions of spring in gradle project"
              cat > rewrite-init.gradle << 'EOF'
          initscript {
            repositories { mavenCentral() }
            dependencies { classpath 'org.openrewrite:plugin:7.3.1' }
          }
          allprojects {
            apply plugin: org.openrewrite.gradle.RewritePlugin
          }
          EOF
            
              ./gradlew --init-script rewrite-init.gradle rewriteRun \
                -Prewrite.activeRecipes=me.abeyta.UpgradeAllSpringLatestPatch
              # Extract new Spring Boot version from Gradle
              new_version=$(./gradlew properties -q 2>/dev/null | grep "^springBootVersion:" | awk '{print $2}' || \
                grep -E "org.springframework.boot" build.gradle build.gradle.kts 2>/dev/null | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1 || \
                grep "springBootVersion" gradle.properties 2>/dev/null | cut -d'=' -f2 | tr -d ' ' || \
                echo "unknown")
            else
              echo "No Maven or Gradle build file found, skipping patch upgrades"
            fi
          
            if git diff --quiet && git diff --cached --quiet; then
              echo "No patch changes to commit."
              exit 1
            fi
          
            branch_name="patch-upgrade-$(date +%Y%m%d-%H%M%S)"
            pr_title="[Auto] Spring Boot Patch Upgrade to ${new_version}"
          
            if [[ "$old_version" != "unknown" && "$new_version" != "unknown" ]]; then
              pr_title="[Auto] Spring Boot Upgrade ${old_version} → ${new_version}"
            fi
          
            git checkout -b "$branch_name"
            git add .
            git commit -m "$pr_title - $(date)"
            git push -u origin "$branch_name"
          
            #gh pr create \
            # --repo "$REPO_FULL_NAME" \
            # --fill \
            # --base main \
            # --head "$branch_name" \
            # --title "$pr_title"
            #
            #echo "Pull request created: $pr_title"
          fi
          
          # clean up
          rm -rf "$ADVISOR_TMP_DIR"
      # hashFiles takes FILE globs — the old '.advisor/errors/' (a bare directory
      # path) matched nothing, so advisor failures rode continue-on-error to a green
      # run (boostertickets 2026-08-04: dependency resolution failed, job succeeded).
      # The '**/' variant also catches errors written under a saa-path subdirectory.
      - name: Get errors if exist
        if: always() && hashFiles('.advisor/errors/**', '**/.advisor/errors/**') != ''
        run: |
          find . -path '*/.advisor/errors/*' -type f -print -exec cat {} \;
          exit 1